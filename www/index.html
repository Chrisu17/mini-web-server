<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Server</title>
    <style>
        body {
            background-color: #eef2f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s ease-out forwards;
        }
        
        /* Animasi Lingkaran Centang */
        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            margin: 0 auto 20px auto;
        }
        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 4;
            stroke-miterlimit: 10;
            stroke: #4BB543;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        /* Animasi Garis Centang */
        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: #4BB543;
            stroke-width: 5;
            fill: none;
            animation: stroke 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }
        
        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }
        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Animasi Teks */
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeIn 0.5s ease-in 1s forwards;
        }
        p {
            color: #7f8c8d;
            font-size: 1.1em;
            opacity: 0;
            margin-bottom: 25px;
            animation: fadeIn 0.5s ease-in 1.2s forwards;
        }
        .status-badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            opacity: 0;
            animation: fadeIn 0.5s ease-in 1.5s forwards;
            border: 1px solid #c8e6c9;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="card">
        <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
            <circle class="checkmark__circle" cx="26" cy="26" r="25" />
            <path class="checkmark__check" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
        </svg>
        
        <h1>Koneksi Berhasil!</h1>
        <p>Mini HTTP Web Server karya Christian Sumangando berjalan dengan lancar.</p>
        <div class="status-badge">● Server Online & Listening</div>
    </div>
</body>
</html>
